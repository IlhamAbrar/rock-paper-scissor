<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>rock-paper-scissor</title>
</head>

<body>
    <!-- TOP OF SCREEN MONEY HUD -->
    <div id="score-display" class="score-display">
        CREDITS: $<span id="score-amount">0</span>
    </div>

    <!-- HERO SECTION -->
    <section class="hero">
        <h1>Welcome</h1>
        <p>SELECT THREAT LEVEL AND BREACH THE TERMINAL.</p>
        <div class="hero-control-group">
            <div class="hero-btn">
                <button class="btn diff-btn" data-diff="easy">EASY</button>
                <button class="btn diff-btn active-medium" data-diff="medium">MEDIUM</button>
                <button class="btn diff-btn" data-diff="hard">HARD</button>
            </div>
            <button id="initiate-btn" class="btn initiate-btn">INITIATE</button>
        </div>
    </section>

    <!-- TERMINAL SECTION -->
    <main id="terminal">
        <div id="cyber-hud" class="hud-container">
            <div class="hud-header">
                <span class="hud-title">CYBER_EYE // OS_v4.02</span>
                <span class="hud-status">STATUS: CONNECTED</span>
            </div>
            <div class="hud-body">
                <p class="typewriter" data-text="> Initializing optics stream..."></p>
                <p class="typewriter" data-text="> Cafe network detected. Target lock acquired."></p>
                <p class="typewriter" id="diff-status-line" data-text=""></p>
                <p class="typewriter" data-text="> ESTABLISHING ENCRYPTED TUNNEL [PORT: 8080]..."></p>
                <p class="typewriter" data-text="> PROTOCOL BREACH IS ACTIVATED. EXECUTE PAYLOAD TO ENGAGE:"></p>
                <p class="typewriter" data-text="PAYLOAD PROTOCOL: ICE > HACK | HACK > DAEMON | DAEMON > ICE"></p>

                <!-- Command Output History -->
                <div id="command-history"></div>

                <!-- Input Interface -->
                <div id="input-container" class="input-container hidden">
                    <span class="prompt-symbol">> EXECUTOR:</span>
                    <textarea id="command-input" placeholder="Awaiting further actions..." rows="1" autocomplete="off"
                        spellcheck="false" autofocus></textarea>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js" defer></script>
</body>

</html>
